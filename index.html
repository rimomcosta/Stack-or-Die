<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Stack or Die</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: fixed;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f0f0f0;
        font-family: Arial, sans-serif;
      }

      #gameContainer {
        position: fixed;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f0f0f0;
        overflow: hidden;
      }

      canvas {
        position: absolute;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      #gameTitle {
        position: absolute;
        top: 10%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 30px;
        text-align: center;
      }
      #instructions {
        position: absolute;
        top: 65%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 18px;
        text-align: center;
        display: none;
      }
      .button {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 20px;
        font-size: 18px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      #startButton {
        top: 50%;
      }
      #tryAgainButton {
        top: 75%;
        display: none;
      }
      #pauseButton {
        padding: 5px 10px;
        display: none;
        min-width: 80px;
        max-width: 80px;
        text-align: center;
      }
      #loadingIndicator {
        position: absolute;
        left: 50%;
        top: 60%;
        transform: translate(-50%, -50%);
        font-size: 18px;
        display: none;
      }
      #mainScreenButton {
        position: absolute;
        left: 50%;
        top: 65%;
        transform: translateX(-50%);
        display: none;
      }

      #tryAgainButton {
        top: 75%;
      }
      @media (max-width: 600px) {
        #gameContainer {
          width: 100%;
          height: 100%;
          max-width: none;
        }
      }

      @supports (-webkit-touch-callout: none) {
        #gameContainer {
          height: -webkit-fill-available;
        }
      }
    </style>
  </head>
  <body>
    <div id="gameContainer">
      <canvas id="gameCanvas"></canvas>
      <h1 id="gameTitle"></h1>
      <button id="startButton" class="button"></button>
      <div id="instructions"></div>
      <button id="mainScreenButton" class="button">Main Screen</button>
      <button id="tryAgainButton" class="button"></button>
      <button id="pauseButton" class="button" tabindex="-1"></button>
      <div id="loadingIndicator"></div>
    </div>
    <script src="config.js"></script>
    <script>
      const gameContainer = document.getElementById("gameContainer");
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const gameTitle = document.getElementById("gameTitle");
      const instructions = document.getElementById("instructions");
      const startButton = document.getElementById("startButton");
      const tryAgainButton = document.getElementById("tryAgainButton");
      const pauseButton = document.getElementById("pauseButton");
      const loadingIndicator = document.getElementById("loadingIndicator");
      const mainScreenButton = document.getElementById("mainScreenButton");

      let WIDTH = GAME_CONFIG.INITIAL_WIDTH;
      let HEIGHT = GAME_CONFIG.INITIAL_HEIGHT;
      let scale;

      let startTime;
      let elapsedTime = 0;
      let gameStarted = false;

      let blockWidth, blockSpeed, direction, score, level, lives;
      let x, y;
      let stack, gameOver, fallingBlock, fallingLeftover;
      let BREAK_PARTICLES = [];
      let blinkCount;
      let powerUps;
      let isPrivileged, showLevelUp, levelUpTimer;
      let gameOverScreenShown = false;
      let isFlashing = false;
      let flashTimer = 0;
      let isBackgroundImageLoaded = false;
      let isMobileBackgroundImageLoaded = false;
      let placeTimeLimit;
      let placeTimeRemaining;

      let animationFrameId;

      let isPaused = false;
      let pauseStartTime = 0;
      let totalPausedTime = 0;

      const backgroundImage = GAME_CONFIG.BACKGROUND_IMAGE_SRC
        ? new Image()
        : null;
      const mobileBackgroundImage = GAME_CONFIG.BACKGROUND_IMAGE_SRC_MOBILE
        ? new Image()
        : null;

      const barImage = GAME_CONFIG.BAR_IMAGE_SRC ? new Image() : null;
      if (barImage) barImage.src = GAME_CONFIG.BAR_IMAGE_SRC;

      function loadBackgroundImages() {
        if (backgroundImage) {
          backgroundImage.onload = () => {
            isBackgroundImageLoaded = true;
            drawBackground();
          };
          backgroundImage.onerror = () => {
            console.warn("Failed to load desktop background image");
            isBackgroundImageLoaded = false;
          };
          backgroundImage.src = GAME_CONFIG.BACKGROUND_IMAGE_SRC;
        }
        if (mobileBackgroundImage) {
          mobileBackgroundImage.onload = () => {
            isMobileBackgroundImageLoaded = true;
            drawBackground();
          };
          mobileBackgroundImage.onerror = () => {
            console.warn("Failed to load mobile background image");
            isMobileBackgroundImageLoaded = false;
          };
          mobileBackgroundImage.src = GAME_CONFIG.BACKGROUND_IMAGE_SRC_MOBILE;
        }
      }

      let powerUpImage = null;
      let extraLifeImage = null;
      let isPowerUpImageLoaded = false;
      let isExtraLifeImageLoaded = false;

      let audioContext;
      let audioSources = {};
      let backgroundMusicSource = null;
      let backgroundMusicBuffer = null;
      let mainScreenMusicSource = null;
      let mainScreenMusicBuffer = null;
      let gameOverMusicSource = null;
      let gameOverMusicBuffer = null;
      let musicStartTime = 0;
      let musicPausedAt = 0;
      let isLoading = false;
      let hasInteracted = false;

      function initUI() {
        gameTitle.textContent = GAME_CONFIG.GAME_TITLE;
        gameTitle.style.color = GAME_CONFIG.STYLES.TITLE_COLOR;

        instructions.innerHTML = GAME_CONFIG.INSTRUCTIONS.join("<br>");
        instructions.style.color = GAME_CONFIG.STYLES.INSTRUCTIONS_COLOR;

        startButton.textContent = GAME_CONFIG.UI.START_BUTTON_TEXT;
        tryAgainButton.textContent = GAME_CONFIG.UI.TRY_AGAIN_BUTTON_TEXT;
        pauseButton.textContent = GAME_CONFIG.UI.PAUSE_BUTTON_TEXT;
        loadingIndicator.textContent = GAME_CONFIG.UI.LOADING_TEXT;

        const buttons = document.querySelectorAll(".button");
        buttons.forEach((button) => {
          button.style.backgroundColor =
            GAME_CONFIG.STYLES.BUTTON_BACKGROUND_COLOR;
          button.style.color = GAME_CONFIG.STYLES.BUTTON_TEXT_COLOR;
        });

        pauseButton.style.backgroundColor =
          GAME_CONFIG.STYLES.PAUSE_BUTTON_BACKGROUND_COLOR;

        buttons.forEach((button) => {
          button.addEventListener("mouseover", function () {
            this.style.backgroundColor =
              this === pauseButton
                ? GAME_CONFIG.STYLES.PAUSE_BUTTON_HOVER_BACKGROUND_COLOR
                : GAME_CONFIG.STYLES.BUTTON_HOVER_BACKGROUND_COLOR;
          });
          button.addEventListener("mouseout", function () {
            this.style.backgroundColor =
              this === pauseButton
                ? GAME_CONFIG.STYLES.PAUSE_BUTTON_BACKGROUND_COLOR
                : GAME_CONFIG.STYLES.BUTTON_BACKGROUND_COLOR;
          });
        });
      }

      function drawBackground() {
        const isMobile = window.innerWidth <= 600;
        const img = isMobile
          ? isMobileBackgroundImageLoaded
            ? mobileBackgroundImage
            : null
          : isBackgroundImageLoaded
          ? backgroundImage
          : null;

        if (img) {
          ctx.drawImage(img, 0, 0, WIDTH, HEIGHT);
        } else {
          ctx.fillStyle = GAME_CONFIG.BACKGROUND_COLOR;
          ctx.fillRect(0, 0, WIDTH, HEIGHT);
        }
      }

      function loadPowerUpImages() {
        if (GAME_CONFIG.POWER_UP_IMAGE_SRC) {
          powerUpImage = new Image();
          powerUpImage.onload = function () {
            isPowerUpImageLoaded = true;
            console.log("Power-up image loaded successfully");
          };
          powerUpImage.onerror = function () {
            console.error("Failed to load power-up image");
            isPowerUpImageLoaded = false;
          };
          powerUpImage.src = GAME_CONFIG.POWER_UP_IMAGE_SRC;
        }

        if (GAME_CONFIG.EXTRA_LIFE_IMAGE_SRC) {
          extraLifeImage = new Image();
          extraLifeImage.onload = function () {
            isExtraLifeImageLoaded = true;
            console.log("Extra life image loaded successfully");
          };
          extraLifeImage.onerror = function () {
            console.error("Failed to load extra life image");
            isExtraLifeImageLoaded = false;
          };
          extraLifeImage.src = GAME_CONFIG.EXTRA_LIFE_IMAGE_SRC;
        }
      }

      function isiOSSafari() {
        const ua = window.navigator.userAgent;
        const iOS = !!ua.match(/iPad/i) || !!ua.match(/iPhone/i);
        const webkit = !!ua.match(/WebKit/i);
        return iOS && webkit && !ua.match(/CriOS/i);
      }

      function resizeCanvas() {
        const containerWidth = gameContainer.clientWidth;
        const containerHeight = gameContainer.clientHeight;
        const aspectRatio = GAME_CONFIG.ASPECT_RATIO;

        let canvasWidth, canvasHeight;

        if (window.innerWidth <= 600) {
          canvasWidth = containerWidth;
          canvasHeight = containerHeight;
        } else {
          if (containerWidth / containerHeight > aspectRatio) {
            canvasHeight = containerHeight;
            canvasWidth = canvasHeight * aspectRatio;
          } else {
            canvasWidth = containerWidth;
            canvasHeight = canvasWidth / aspectRatio;
          }
        }

        canvas.style.width = `${canvasWidth}px`;
        canvas.style.height = `${canvasHeight}px`;
        canvas.width = canvasWidth * window.devicePixelRatio;
        canvas.height = canvasHeight * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

        WIDTH = canvasWidth;
        HEIGHT = canvasHeight;

        scale = WIDTH / GAME_CONFIG.INITIAL_WIDTH;

        canvas.style.position = "absolute";
        canvas.style.left = `${(containerWidth - canvasWidth) / 2}px`;
        canvas.style.top = `${(containerHeight - canvasHeight) / 2}px`;

        adjustUIElements();

        if (gameOver) {
          drawGameOverScreen();
        } else if (isPaused) {
          drawPauseScreen();
        } else if (!gameStarted) {
          showMainScreen();
        } else {
          drawGameState();
        }
      }

      function adjustUIElements() {
        const elements = [
          gameTitle,
          instructions,
          startButton,
          tryAgainButton,
          pauseButton,
          mainScreenButton,
        ];
        elements.forEach((element) => {
          if (element) {
            element.style.position = "absolute";
            element.style.left = `${canvas.offsetLeft + WIDTH / 2}px`;
            element.style.transform = "translateX(-50%)";
          }
        });

        if (gameTitle)
          gameTitle.style.top = `${canvas.offsetTop + HEIGHT * 0.1}px`;
        if (instructions)
          instructions.style.top = `${canvas.offsetTop + HEIGHT * 0.65}px`;
        if (startButton)
          startButton.style.top = `${canvas.offsetTop + HEIGHT * 0.5}px`;
        if (tryAgainButton)
          tryAgainButton.style.top = `${canvas.offsetTop + HEIGHT * 0.75}px`;
        if (pauseButton) {
          pauseButton.style.top = `${canvas.offsetTop + 30}px`;
          pauseButton.style.left = `${
            canvas.offsetLeft + WIDTH - pauseButton.offsetWidth - 20
          }px`;
          pauseButton.style.transform = "none";
        }
        if (mainScreenButton)
          mainScreenButton.style.top = `${canvas.offsetTop + HEIGHT * 0.65}px`;
      }

      function initAudioContext() {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      async function loadAudio(key, url) {
        if (!url) return null;

        try {
          const response = await fetch(url);
          const arrayBuffer = await response.arrayBuffer();
          const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
          audioSources[key] = audioBuffer;
          return audioBuffer;
        } catch (error) {
          console.warn(`Failed to load audio: ${key}`, error);
          return null;
        }
      }

      function playSound(sound) {
        if (audioContext.state === "suspended") {
          audioContext.resume();
        }

        if (audioSources[sound]) {
          const source = audioContext.createBufferSource();
          source.buffer = audioSources[sound];
          source.connect(audioContext.destination);
          source.start(0);
        } else {
          const oscillator = audioContext.createOscillator();
          oscillator.type = "sine";

          switch (sound) {
            case "BLOCK_PLACE":
              oscillator.frequency.setValueAtTime(
                440,
                audioContext.currentTime
              );
              break;
            case "BLOCK_FALL":
              oscillator.frequency.setValueAtTime(
                220,
                audioContext.currentTime
              );
              break;
            case "POWER_UP_COLLECT":
              oscillator.frequency.setValueAtTime(
                880,
                audioContext.currentTime
              );
              break;
            case "EXTRA_LIFE_COLLECT":
              oscillator.frequency.setValueAtTime(
                1760,
                audioContext.currentTime
              );
              break;
            case "LEVEL_UP":
              oscillator.frequency.setValueAtTime(
                1046.5,
                audioContext.currentTime
              );
              break;
            case "GAME_OVER":
              oscillator.frequency.setValueAtTime(
                110,
                audioContext.currentTime
              );
              break;
            case "BLOCK_BREAK":
              oscillator.frequency.setValueAtTime(
                660,
                audioContext.currentTime
              );
              break;
            case "BLOCK_SLICE":
              oscillator.frequency.setValueAtTime(
                550,
                audioContext.currentTime
              );
              break;
            default:
              oscillator.frequency.setValueAtTime(
                440,
                audioContext.currentTime
              );
          }

          oscillator.connect(audioContext.destination);
          oscillator.start();
          oscillator.stop(audioContext.currentTime + 0.1);
        }
      }

      async function initAudio() {
        if (!audioContext) {
          audioContext = new (window.AudioContext ||
            window.webkitAudioContext)();
        }

        if (Object.keys(audioSources).length === 0) {
          const audioPromises = Object.entries(GAME_CONFIG.AUDIO).map(
            ([key, url]) => loadAudio(key, url)
          );
          await Promise.all(audioPromises);

          backgroundMusicBuffer = audioSources["BACKGROUND_MUSIC"];
          mainScreenMusicBuffer = audioSources["MAIN_SCREEN_MUSIC"];
          gameOverMusicBuffer = audioSources["GAME_OVER_MUSIC"];
        }

        await audioContext.resume();
      }

      function playBackgroundMusic(buffer) {
        if (
          buffer &&
          (!backgroundMusicSource || !backgroundMusicSource.isPlaying)
        ) {
          if (backgroundMusicSource) {
            backgroundMusicSource.stop();
          }
          backgroundMusicSource = audioContext.createBufferSource();
          backgroundMusicSource.buffer = buffer;
          backgroundMusicSource.loop = true;
          backgroundMusicSource.connect(audioContext.destination);
          backgroundMusicSource.start(0, musicPausedAt);
          musicStartTime = audioContext.currentTime - musicPausedAt;
          backgroundMusicSource.isPlaying = true;
        }
      }

      function pauseBackgroundMusic() {
        if (backgroundMusicSource && backgroundMusicSource.isPlaying) {
          backgroundMusicSource.stop();
          musicPausedAt =
            (audioContext.currentTime - musicStartTime) %
            backgroundMusicBuffer.duration;
          backgroundMusicSource.isPlaying = false;
        }
      }
      function resumeBackgroundMusic() {
        if (backgroundMusicBuffer) {
          playBackgroundMusic(backgroundMusicBuffer);
        }
      }

      function playMainScreenMusic() {
        if (
          mainScreenMusicBuffer &&
          (!mainScreenMusicSource || !mainScreenMusicSource.isPlaying)
        ) {
          if (mainScreenMusicSource) {
            mainScreenMusicSource.stop();
          }
          mainScreenMusicSource = audioContext.createBufferSource();
          mainScreenMusicSource.buffer = mainScreenMusicBuffer;
          mainScreenMusicSource.loop = true;
          mainScreenMusicSource.connect(audioContext.destination);
          mainScreenMusicSource.start(0);
          mainScreenMusicSource.isPlaying = true;
        }
      }

      function playGameOverMusic() {
        if (
          gameOverMusicBuffer &&
          (!gameOverMusicSource || !gameOverMusicSource.isPlaying)
        ) {
          if (gameOverMusicSource) {
            gameOverMusicSource.stop();
          }
          gameOverMusicSource = audioContext.createBufferSource();
          gameOverMusicSource.buffer = gameOverMusicBuffer;
          gameOverMusicSource.loop = true;
          gameOverMusicSource.connect(audioContext.destination);
          gameOverMusicSource.start(0);
          gameOverMusicSource.isPlaying = true;
        }
      }

      function stopAllMusic() {
        if (backgroundMusicSource) {
          backgroundMusicSource.stop();
          backgroundMusicSource.isPlaying = false;
        }
        if (mainScreenMusicSource) {
          mainScreenMusicSource.stop();
          mainScreenMusicSource.isPlaying = false;
        }
        if (gameOverMusicSource) {
          gameOverMusicSource.stop();
          gameOverMusicSource.isPlaying = false;
        }
      }

      function initGame() {
        blockWidth = GAME_CONFIG.INITIAL_BLOCK_WIDTH * scale;
        blockSpeed = GAME_CONFIG.INITIAL_BLOCK_SPEED * scale;
        score = 0;
        level = 1;
        lives = GAME_CONFIG.MAX_LIVES;
        stack = [];
        gameOver = false;
        gameOverScreenShown = false;
        fallingBlock = null;
        fallingLeftover = null;
        BREAK_PARTICLES = [];
        blinkCount = 0;
        powerUps = [];
        isPrivileged = false;
        showLevelUp = false;
        levelUpTimer = 0;
        tryAgainButton.style.display = "none";
        startTime = Date.now();
        resetBlockPosition();
        resetPlaceTimeLimit();
        pauseStartTime = 0;
        totalPausedTime = 0;
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
        }

        if (audioContext && audioContext.state === "suspended") {
          audioContext.resume();
        }

        pauseButton.style.display = "block"; // Ensure the pause button is visible
        animationFrameId = requestAnimationFrame(gameLoop);
        resizeCanvas();
      }

      function togglePause() {
        if (gameOver) return;
        if (!isPaused) {
          isPaused = true;
          pauseStartTime = Date.now();
          pauseButton.textContent = GAME_CONFIG.UI.RESUME_BUTTON_TEXT;
          pauseBackgroundMusic();
        } else {
          isPaused = false;
          totalPausedTime += Date.now() - pauseStartTime;
          pauseButton.textContent = GAME_CONFIG.UI.PAUSE_BUTTON_TEXT;
          resumeBackgroundMusic();
        }
        drawBackground();
      }

      function resetPlaceTimeLimit() {
        placeTimeLimit =
          Math.random() *
            (GAME_CONFIG.MAX_PLACE_TIME - GAME_CONFIG.MIN_PLACE_TIME) +
          GAME_CONFIG.MIN_PLACE_TIME;
        placeTimeRemaining = placeTimeLimit;
      }

      function resetBlockPosition() {
        if (Math.random() < 0.5) {
          x = 0;
          direction = 1;
        } else {
          x = WIDTH - blockWidth;
          direction = -1;
        }
        y =
          HEIGHT -
          GAME_CONFIG.BLOCK_HEIGHT * scale -
          stack.length * GAME_CONFIG.BLOCK_HEIGHT * scale;
      }

      function drawBlock(x, y, width, color) {
        ctx.save();

        ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
        ctx.shadowBlur = 10 * scale;
        ctx.shadowOffsetY = 5 * scale;

        if (isPrivileged && !fallingBlock) {
          const gradient = ctx.createLinearGradient(
            x,
            y,
            x + width,
            y + GAME_CONFIG.BLOCK_HEIGHT * scale
          );
          gradient.addColorStop(0, "#FFD700");
          gradient.addColorStop(0.5, "#FFF700");
          gradient.addColorStop(1, "#FFD700");
          ctx.fillStyle = gradient;
          ctx.fillRect(x, y, width, GAME_CONFIG.BLOCK_HEIGHT * scale);
        } else if (barImage) {
          ctx.drawImage(
            barImage,
            x,
            y,
            width,
            GAME_CONFIG.BLOCK_HEIGHT * scale
          );
        } else {
          ctx.fillStyle = color;
          ctx.fillRect(x, y, width, GAME_CONFIG.BLOCK_HEIGHT * scale);
        }

        ctx.shadowColor = "transparent";
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        if (isPrivileged && !fallingBlock) {
          ctx.strokeStyle = "#DAA520";
          ctx.lineWidth = 2 * scale;
          ctx.strokeRect(x, y, width, GAME_CONFIG.BLOCK_HEIGHT * scale);
        }

        ctx.restore();
      }

      function drawScore() {
        ctx.fillStyle = GAME_CONFIG.TEXT_COLOR;
        ctx.font = `${20 * scale}px ${GAME_CONFIG.FONT_FAMILY}`;
        ctx.textAlign = "left";

        const lineHeight = 25 * scale;
        const topPadding = 30 * scale;

        const timeText = `Time: ${formatTime(elapsedTime)}`;
        ctx.fillText(timeText, 10 * scale, topPadding);

        ctx.fillText(`Score: ${score}`, 10 * scale, topPadding + lineHeight);
        ctx.fillText(
          `Level: ${level}`,
          10 * scale,
          topPadding + 2 * lineHeight
        );
        ctx.fillText(
          `Lives: ${lives}`,
          10 * scale,
          topPadding + 3 * lineHeight
        );

        ctx.textAlign = "left";
      }

      function formatTime(ms) {
        let seconds = Math.floor(ms / 1000);
        let minutes = Math.floor(seconds / 60);
        seconds = seconds % 60;
        return `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
      }

      function moveBlock() {
        x += blockSpeed * direction;
        if (x < 0) {
          x = 0;
          direction = 1;
          playSound("EDGE_LEFT");
        } else if (x + blockWidth > WIDTH) {
          x = WIDTH - blockWidth;
          direction = -1;
          playSound("EDGE_RIGHT");
        }
      }

      function gameLoop() {
        if (gameOver) {
          showGameOver();
        } else if (isPaused) {
          drawBackground();
          drawGameState();
          drawPauseScreen();
        } else {
          elapsedTime = Date.now() - startTime - totalPausedTime;

          drawBackground();

          if (!fallingBlock) {
            moveBlock();
            checkPowerUpCollision();

            placeTimeRemaining -= 1 / 60;
            if (placeTimeRemaining <= 0) {
              placeBlock();
              resetPlaceTimeLimit();
            }
          }

          updateFallingBlocks();
          updatePowerUps();
          drawGameState();

          if (isFlashing) {
            flashTimer++;
            if (flashTimer <= GAME_CONFIG.FLASH_COUNT * 2) {
              if (flashTimer % 2 === 1) {
                ctx.fillStyle = GAME_CONFIG.FLASH_COLOR;
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
              }
            } else {
              isFlashing = false;
              flashTimer = 0;
            }
          }

          if (showLevelUp) {
            drawLevelUp();
            levelUpTimer++;
            if (levelUpTimer > GAME_CONFIG.LEVEL_UP_DISPLAY_DURATION) {
              showLevelUp = false;
              levelUpTimer = 0;
            }
          }
          drawTimerBar();
        }
        animationFrameId = requestAnimationFrame(gameLoop);
      }

      function drawPauseScreen() {
        ctx.fillStyle = GAME_CONFIG.GAME_OVER_OVERLAY_COLOR;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = GAME_CONFIG.GAME_OVER_TEXT_COLOR;
        ctx.font = `${48 * scale}px ${GAME_CONFIG.FONT_FAMILY}`;
        ctx.textAlign = "center";
        ctx.fillText("PAUSED", WIDTH / 2, HEIGHT / 2 - 20 * scale);
        ctx.textAlign = "left";
      }

      function drawTimerBar() {
        const barHeight = 10 * scale;

        ctx.fillStyle = "lightgray";
        ctx.fillRect(0, 0, WIDTH, barHeight);

        const remainingWidth = (placeTimeRemaining / placeTimeLimit) * WIDTH;
        ctx.fillStyle = GAME_CONFIG.TIME_BAR_COLOR;
        ctx.fillRect(0, 0, remainingWidth, barHeight);
      }

      function updateFallingBlocks() {
        if (fallingBlock) {
          fallingBlock.vy += GAME_CONFIG.GRAVITY * scale;
          fallingBlock.y += fallingBlock.vy;

          if (
            fallingBlock.y + GAME_CONFIG.BLOCK_HEIGHT * scale >= HEIGHT ||
            checkCollision(fallingBlock)
          ) {
            fallingBlock.y = Math.min(
              fallingBlock.y,
              HEIGHT - GAME_CONFIG.BLOCK_HEIGHT * scale
            );
            loseLife();
          }
        }

        if (fallingLeftover) {
          fallingLeftover.vy += GAME_CONFIG.GRAVITY * scale;
          fallingLeftover.y += fallingLeftover.vy;

          if (
            fallingLeftover.y + GAME_CONFIG.BLOCK_HEIGHT * scale >= HEIGHT ||
            checkCollision(fallingLeftover)
          ) {
            fallingLeftover.y = Math.min(
              fallingLeftover.y,
              HEIGHT - GAME_CONFIG.BLOCK_HEIGHT * scale
            );
            createBreakParticles(fallingLeftover);
            fallingLeftover = null;
          }
        }
      }

      function loseLife() {
        lives--;
        createBreakParticles(fallingBlock);
        playSound("BLOCK_FALL");
        isFlashing = true;
        flashTimer = 0;

        score = Math.max(0, Math.floor(score * 0.9));

        if (lives <= 0) {
          gameOver = true;
          showGameOver();
        } else {
          fallingBlock = null;
          resetBlockPosition();
          resetPlaceTimeLimit();

          blockWidth = GAME_CONFIG.INITIAL_BLOCK_WIDTH * scale;
          isPrivileged = true;
        }
      }

      function updatePowerUps() {
        if (Math.random() < GAME_CONFIG.POWER_UP_CHANCE) {
          powerUps.push({
            x:
              Math.random() *
                (WIDTH - 2 * GAME_CONFIG.POWER_UP_RADIUS * scale) +
              GAME_CONFIG.POWER_UP_RADIUS * scale,
            y: -GAME_CONFIG.POWER_UP_RADIUS * scale,
            angle: 0,
            type:
              Math.random() < GAME_CONFIG.EXTRA_LIFE_CHANCE
                ? "extraLife"
                : "normal",
          });
        }

        for (let i = powerUps.length - 1; i >= 0; i--) {
          let powerUp = powerUps[i];
          powerUp.y += GAME_CONFIG.POWER_UP_FALL_SPEED * scale;
          powerUp.angle += GAME_CONFIG.POWER_UP_WIGGLE_SPEED;
          powerUp.x +=
            Math.sin(powerUp.angle) *
            GAME_CONFIG.POWER_UP_WIGGLE_AMPLITUDE *
            scale;

          if (powerUp.x < 0) powerUp.x += WIDTH;
          if (powerUp.x > WIDTH) powerUp.x -= WIDTH;

          if (powerUp.y > HEIGHT + GAME_CONFIG.POWER_UP_RADIUS * scale) {
            powerUps.splice(i, 1);
          }
        }
      }

      function checkPowerUpCollision() {
        for (let i = powerUps.length - 1; i >= 0; i--) {
          let powerUp = powerUps[i];
          if (
            powerUp.y + GAME_CONFIG.POWER_UP_RADIUS * scale > y &&
            powerUp.y - GAME_CONFIG.POWER_UP_RADIUS * scale <
              y + GAME_CONFIG.BLOCK_HEIGHT * scale &&
            powerUp.x + GAME_CONFIG.POWER_UP_RADIUS * scale > x &&
            powerUp.x - GAME_CONFIG.POWER_UP_RADIUS * scale < x + blockWidth
          ) {
            if (powerUp.type === "extraLife") {
              lives++;
              playSound("EXTRA_LIFE_COLLECT");
            } else {
              const recoveryPercentage = Math.random() * 0.4 + 0.3;
              const recoveryAmount =
                GAME_CONFIG.INITIAL_BLOCK_WIDTH * scale * recoveryPercentage;
              blockWidth = Math.min(
                blockWidth + recoveryAmount,
                GAME_CONFIG.INITIAL_BLOCK_WIDTH * scale
              );

              if (x + blockWidth > WIDTH) {
                x = WIDTH - blockWidth;
              }

              playSound("POWER_UP_COLLECT");
              isPrivileged = true;
            }

            score = Math.max(0, Math.floor(score * 0.95));

            powerUps.splice(i, 1);
            break;
          }
        }
      }

      function drawGameState() {
        stack.forEach((block) =>
          drawBlock(block.x, block.y, block.width, GAME_CONFIG.BLOCK_COLOR)
        );

        if (fallingBlock) {
          drawBlock(
            fallingBlock.x,
            fallingBlock.y,
            fallingBlock.width,
            GAME_CONFIG.FALLING_BLOCK_COLOR
          );
        } else if (!gameOver) {
          drawBlock(x, y, blockWidth, GAME_CONFIG.BLOCK_COLOR);
        }

        if (fallingLeftover) {
          drawBlock(
            fallingLeftover.x,
            fallingLeftover.y,
            fallingLeftover.width,
            GAME_CONFIG.BLOCK_COLOR
          );
        }

        powerUps.forEach((powerUp) => {
          if (
            powerUp.type === "extraLife" &&
            isExtraLifeImageLoaded &&
            extraLifeImage
          ) {
            try {
              ctx.drawImage(
                extraLifeImage,
                powerUp.x - GAME_CONFIG.POWER_UP_RADIUS * scale,
                powerUp.y - GAME_CONFIG.POWER_UP_RADIUS * scale,
                GAME_CONFIG.POWER_UP_RADIUS * 2 * scale,
                GAME_CONFIG.POWER_UP_RADIUS * 2 * scale
              );
            } catch (error) {
              console.error("Error drawing extra life image:", error);
              drawFallbackPowerUp(powerUp);
            }
          } else if (
            powerUp.type !== "extraLife" &&
            isPowerUpImageLoaded &&
            powerUpImage
          ) {
            try {
              ctx.drawImage(
                powerUpImage,
                powerUp.x - GAME_CONFIG.POWER_UP_RADIUS * scale,
                powerUp.y - GAME_CONFIG.POWER_UP_RADIUS * scale,
                GAME_CONFIG.POWER_UP_RADIUS * 2 * scale,
                GAME_CONFIG.POWER_UP_RADIUS * 2 * scale
              );
            } catch (error) {
              console.error("Error drawing power-up image:", error);
              drawFallbackPowerUp(powerUp);
            }
          } else {
            drawFallbackPowerUp(powerUp);
          }
        });

        updateAndDrawParticles();
        drawScore();
      }

      function drawFallbackPowerUp(powerUp) {
        ctx.beginPath();
        ctx.arc(
          powerUp.x,
          powerUp.y,
          GAME_CONFIG.POWER_UP_RADIUS * scale,
          0,
          Math.PI * 2
        );
        ctx.fillStyle =
          powerUp.type === "extraLife"
            ? GAME_CONFIG.EXTRA_LIFE_COLOR
            : GAME_CONFIG.POWER_UP_COLOR;
        ctx.fill();
        ctx.strokeStyle = GAME_CONFIG.POWER_UP_STROKE_COLOR;
        ctx.lineWidth = 1 * scale;
        ctx.stroke();
      }

      function checkCollision(block) {
        for (let stackBlock of stack) {
          if (
            block.y + GAME_CONFIG.BLOCK_HEIGHT * scale > stackBlock.y &&
            block.y < stackBlock.y + GAME_CONFIG.BLOCK_HEIGHT * scale &&
            block.x < stackBlock.x + stackBlock.width &&
            block.x + block.width > stackBlock.x
          ) {
            return true;
          }
        }
        return false;
      }

      function calculateScore(blockWidth, newWidth, timeRemaining) {
        let points = 10;
        if (newWidth < blockWidth) {
          const percentageLost = (blockWidth - newWidth) / blockWidth;
          const pointsLost = Math.round(10 * percentageLost);
          points -= pointsLost;
        }
        const timeBonus = Math.round(10 * (timeRemaining / placeTimeLimit));
        points += timeBonus;
        return points;
      }

      function placeBlock() {
        if (gameOver || fallingBlock) return;

        if (audioContext.state === "suspended") {
          audioContext.resume();
        }

        let pointsEarned = 0;

        if (stack.length === 0) {
          stack.push({ x, y, width: blockWidth });
          pointsEarned = calculateScore(
            blockWidth,
            blockWidth,
            placeTimeRemaining
          );
          playSound("BLOCK_PLACE");
        } else {
          const prevBlock = stack[stack.length - 1];
          let overlap =
            Math.min(x + blockWidth, prevBlock.x + prevBlock.width) -
            Math.max(x, prevBlock.x);

          const snapThreshold = GAME_CONFIG.SNAP_THRESHOLD * scale;
          if (Math.abs(x - prevBlock.x) <= snapThreshold) {
            x = prevBlock.x;
            overlap = blockWidth;
          } else if (
            Math.abs(x + blockWidth - (prevBlock.x + prevBlock.width)) <=
            snapThreshold
          ) {
            x = prevBlock.x + prevBlock.width - blockWidth;
            overlap = blockWidth;
          }

          if (overlap >= 1) {
            const newWidth = isPrivileged ? blockWidth : overlap;
            const newX = isPrivileged ? x : Math.max(x, prevBlock.x);
            stack.push({ x: newX, y, width: newWidth });

            pointsEarned = calculateScore(
              blockWidth,
              newWidth,
              placeTimeRemaining
            );

            if (!isPrivileged && overlap < blockWidth) {
              if (x < newX) {
                fallingLeftover = { x, y, width: newX - x, vy: 0 };
              } else {
                fallingLeftover = {
                  x: newX + newWidth,
                  y,
                  width: x + blockWidth - (newX + newWidth),
                  vy: 0,
                };
              }
              playSound("BLOCK_SLICE");
            } else {
              playSound("BLOCK_PLACE");
            }

            blockWidth = newWidth;

            if (
              stack.length * GAME_CONFIG.BLOCK_HEIGHT * scale >=
              HEIGHT * GAME_CONFIG.LEVEL_UP_THRESHOLD
            ) {
              levelUp();
            }
          } else {
            fallingBlock = { x, y, width: blockWidth, vy: 0 };
            playSound("BLOCK_SLICE");
            return;
          }
        }

        score += pointsEarned;

        isPrivileged = false;
        resetBlockPosition();
        resetPlaceTimeLimit();
      }

      function levelUp() {
        level++;
        blockSpeed *= GAME_CONFIG.SPEED_INCREASE_FACTOR;
        showLevelUp = true;
        levelUpTimer = 0;

        playSound("LEVEL_UP");

        stack = [];
        resetBlockPosition();
        GAME_CONFIG.MIN_PLACE_TIME *= GAME_CONFIG.PLACE_TIME_DECREASE_FACTOR;
        GAME_CONFIG.MAX_PLACE_TIME *= GAME_CONFIG.PLACE_TIME_DECREASE_FACTOR;

        resetPlaceTimeLimit();
      }

      function drawLevelUp() {
        ctx.fillStyle = GAME_CONFIG.GAME_OVER_OVERLAY_COLOR;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = GAME_CONFIG.GAME_OVER_TEXT_COLOR;
        ctx.font = `${48 * scale}px ${GAME_CONFIG.FONT_FAMILY}`;
        ctx.textAlign = "center";
        ctx.fillText(`Level ${level}!`, WIDTH / 2, HEIGHT / 2 - 40 * scale);
        ctx.font = `${24 * scale}px ${GAME_CONFIG.FONT_FAMILY}`;
        ctx.fillText("Speed increased!", WIDTH / 2, HEIGHT / 2);
        ctx.textAlign = "left";
      }

      function createBreakParticles(block) {
        playSound("BLOCK_BREAK");
        const minParticleSize =
          GAME_CONFIG.BLOCK_HEIGHT *
          scale *
          GAME_CONFIG.MIN_PARTICLE_SIZE_RATIO;
        const maxParticleSize =
          GAME_CONFIG.BLOCK_HEIGHT *
          scale *
          GAME_CONFIG.MAX_PARTICLE_SIZE_RATIO;
        const particlesToCreate = Math.min(
          GAME_CONFIG.MAX_PARTICLES,
          Math.floor(
            (block.width * GAME_CONFIG.BLOCK_HEIGHT * scale) /
              (minParticleSize * minParticleSize)
          )
        );

        for (let i = 0; i < particlesToCreate; i++) {
          const size =
            Math.random() * (maxParticleSize - minParticleSize) +
            minParticleSize;
          const x = block.x + Math.random() * (block.width - size);
          const y =
            block.y + Math.random() * (GAME_CONFIG.BLOCK_HEIGHT * scale - size);

          BREAK_PARTICLES.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 5 * scale,
            vy: (Math.random() - 0.5) * 5 * scale,
            size: size,
            sourceX: x - block.x,
            sourceY: y - block.y,
            rotation: Math.random() * Math.PI * 2,
            angularVelocity: (Math.random() - 0.5) * 0.2,
          });
        }
      }

      function updateAndDrawParticles() {
        ctx.save();
        ctx.shadowColor = GAME_CONFIG.PARTICLE_SHADOW_COLOR;
        ctx.shadowBlur = GAME_CONFIG.PARTICLE_SHADOW_BLUR * scale;
        ctx.shadowOffsetX = GAME_CONFIG.PARTICLE_SHADOW_OFFSET_X * scale;
        ctx.shadowOffsetY = GAME_CONFIG.PARTICLE_SHADOW_OFFSET_Y * scale;

        for (let i = BREAK_PARTICLES.length - 1; i >= 0; i--) {
          let p = BREAK_PARTICLES[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += GAME_CONFIG.GRAVITY * scale * 0.2;
          p.rotation += p.angularVelocity;

          ctx.save();
          ctx.translate(p.x + p.size / 2, p.y + p.size / 2);
          ctx.rotate(p.rotation);

          if (barImage) {
            ctx.drawImage(
              barImage,
              p.sourceX,
              p.sourceY,
              p.size,
              p.size,
              -p.size / 2,
              -p.size / 2,
              p.size,
              p.size
            );
          } else {
            ctx.fillStyle = GAME_CONFIG.BLOCK_COLOR;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          }

          ctx.restore();

          if (p.y > HEIGHT) {
            BREAK_PARTICLES.splice(i, 1);
          }
        }

        ctx.restore(); // Restore the original context state
      }

      function drawGameOverScreen() {
        ctx.fillStyle = GAME_CONFIG.GAME_OVER_OVERLAY_COLOR;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = GAME_CONFIG.GAME_OVER_TEXT_COLOR;
        ctx.font = `${48 * scale}px ${GAME_CONFIG.FONT_FAMILY}`;
        ctx.textAlign = "center";
        ctx.fillText("Game Over", WIDTH / 2, HEIGHT / 2 - 60 * scale);
        ctx.font = `${24 * scale}px ${GAME_CONFIG.FONT_FAMILY}`;
        ctx.fillText(`Score: ${score}`, WIDTH / 2, HEIGHT / 2 - 20 * scale);
        ctx.fillText(`Level: ${level}`, WIDTH / 2, HEIGHT / 2 + 10 * scale);
        ctx.fillText(
          `Time: ${formatTime(elapsedTime)}`,
          WIDTH / 2,
          HEIGHT / 2 + 40 * scale
        );
        ctx.textAlign = "left";
        tryAgainButton.style.display = "block";
      }

      function showGameOver() {
        if (gameOverScreenShown) return;
        gameOverScreenShown = true;

        isFlashing = false;
        flashTimer = 0;

        drawGameOverScreen();
        playSound("GAME_OVER");
        pauseButton.style.display = "none";

        stopAllMusic();
        playGameOverMusic();

        mainScreenButton.style.display = "block";
        tryAgainButton.style.display = "block";
      }

      function stopMainScreenMusic() {
        if (mainScreenMusicSource) {
          mainScreenMusicSource.stop();
          mainScreenMusicSource.isPlaying = false;
        }
      }

      function handleTryAgain() {
        stopAllMusic();
        restartGame();
      }

      function handleMainScreen() {
        stopAllMusic();
        showMainScreen();
        playMainScreenMusic();
      }

      function restartGame() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        gameOverScreenShown = false;

        score = 0;
        level = 1;
        lives = GAME_CONFIG.MAX_LIVES;

        initGame();

        if (backgroundMusicBuffer) {
          playBackgroundMusic(backgroundMusicBuffer);
        }

        tryAgainButton.style.display = "none";
        mainScreenButton.style.display = "none";

        pauseButton.style.display = "block";

        hideMainScreen();
      }

      function showMainScreen() {
        // Clear the canvas
        ctx.clearRect(0, 0, WIDTH, HEIGHT);

        gameTitle.style.display = "block";
        startButton.style.display = "block";
        instructions.style.display = "block";
        tryAgainButton.style.display = "none";
        mainScreenButton.style.display = "none";
        pauseButton.style.display = "none";

        // Redraw the background
        drawBackground();

        gameStarted = false; // Add this line
      }

      function hideMainScreen() {
        gameTitle.style.display = "none";
        startButton.style.display = "none";
        instructions.style.display = "none";
      }

      async function startGame() {
        if (isLoading) return;

        isLoading = true;
        startButton.disabled = true;
        loadingIndicator.style.display = "block";

        try {
          // Always initialize audio, even if it's already been initialized
          await initAudio();
          hasInteracted = true;

          stopAllMusic(); // Stop any currently playing music
          loadPowerUpImages();
          initGame();
          hideMainScreen();
          mainScreenButton.style.display = "none";
          loadingIndicator.style.display = "none";

          // Ensure background music starts
          if (backgroundMusicBuffer) {
            await audioContext.resume(); // Ensure audio context is running
            playBackgroundMusic(backgroundMusicBuffer);
          } else {
            console.warn("Background music buffer not loaded");
          }

          gameStarted = true;
          pauseButton.style.display = "block"; // Ensure the pause button is visible
        } catch (error) {
          console.error("Error starting game:", error);
          loadingIndicator.textContent = GAME_CONFIG.UI.LOADING_ERROR_TEXT;
        } finally {
          isLoading = false;
          startButton.disabled = false;
          if (!gameStarted) {
            gameStarted = true;
            animationFrameId = requestAnimationFrame(gameLoop);
          }
        }
      }

      function startMainScreenMusic() {
        if (!hasInteracted) {
          hasInteracted = true;
          initAudio().then(() => {
            if (!gameStarted) {
              playMainScreenMusic();
            }
          });
        }
      }

      document.addEventListener("keydown", (event) => {
        if (event.code === "Space" && document.activeElement === pauseButton) {
          event.preventDefault();
        }

        if (event.code === "Space") {
          if (gameOver && gameOverScreenShown) {
            handleTryAgain();
          } else if (gameStarted && !gameOver && !isPaused) {
            placeBlock();
          }
        } else if (event.code === "Escape" && gameStarted) {
          togglePause();
        }
      });

      canvas.addEventListener("touchstart", (event) => {
        event.preventDefault();
        if (gameStarted && !gameOver && !isPaused) {
          placeBlock();
        } else if (
          gameStarted &&
          isPaused &&
          document.elementFromPoint(
            event.touches[0].clientX,
            event.touches[0].clientY
          ) === pauseButton
        ) {
          togglePause();
        }
      });

      mainScreenButton.addEventListener("click", handleMainScreen);

      canvas.addEventListener("mousedown", (event) => {
        if (gameStarted && !gameOver && !isPaused) {
          placeBlock();
        } else if (gameStarted && isPaused && event.target === pauseButton) {
          togglePause();
        }
      });

      tryAgainButton.addEventListener("click", handleTryAgain);
      startButton.addEventListener("click", startGame);
      pauseButton.addEventListener("click", (event) => {
        if (!gameOver) {
          event.preventDefault();
          togglePause();
          pauseButton.blur();
        }
      });

      // Initial setup
      initUI();
      loadBackgroundImages();
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
      showMainScreen();

      // Start main screen music on first interaction
      document.addEventListener("click", startMainScreenMusic, { once: true });
      document.addEventListener("keydown", startMainScreenMusic, {
        once: true,
      });
      document.addEventListener("pointerdown", startMainScreenMusic, {
        once: true,
      });
      document.addEventListener("touchstart", startMainScreenMusic, {
        once: true,
      });

      window.addEventListener("orientationchange", function () {
        setTimeout(resizeCanvas, 100);
      });

      window.addEventListener("load", function () {
        // Create and dispatch synthetic events
        var clickEvent = new MouseEvent("click", {
          view: window,
          bubbles: true,
          cancelable: true,
        });
        document.dispatchEvent(clickEvent);

        var touchEvent = new TouchEvent("touchstart", {
          view: window,
          bubbles: true,
          cancelable: true,
          touches: [
            new Touch({ identifier: Date.now(), target: document.body }),
          ],
          targetTouches: [],
          changedTouches: [
            new Touch({ identifier: Date.now(), target: document.body }),
          ],
        });
        document.dispatchEvent(touchEvent);

        var pointerEvent = new PointerEvent("pointerdown", {
          view: window,
          bubbles: true,
          cancelable: true,
        });
        document.dispatchEvent(pointerEvent);

        // Attempt to start the audio
        startMainScreenMusic();
      });

      window.addEventListener("load", resizeCanvas);
      window.addEventListener("resize", resizeCanvas);

      if (isiOSSafari() && window.visualViewport) {
        window.visualViewport.addEventListener("resize", resizeCanvas);
      }
      // Call resizeCanvas on load, resize, and orientation change
      window.addEventListener("load", resizeCanvas);
      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("orientationchange", function () {
        setTimeout(resizeCanvas, 100);
      });

      // For iOS Safari, also listen to scroll events
      if (isiOSSafari()) {
        window.addEventListener("scroll", function () {
          window.scrollTo(0, 0);
          resizeCanvas();
        });
      }

      // Initial call with a slight delay
      setTimeout(resizeCanvas, 100);

      document.body.addEventListener(
        "touchmove",
        function (e) {
          e.preventDefault();
        },
        { passive: false }
      );

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", resizeCanvas);
      }
    </script>
  </body>
</html>
