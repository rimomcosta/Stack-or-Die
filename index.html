<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Stacking Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 2 / 3;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #tryAgainButton {
            position: absolute;
            left: 50%;
            top: 70%;
            transform: translate(-50%, -50%);
            padding: 10px 20px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }
        #tryAgainButton:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <button id="tryAgainButton">Try Again</button>
    </div>
    <script>
        // Game configuration parameters
        const GAME_CONFIG = {
            INITIAL_BLOCK_SPEED: 2,
            INITIAL_BLOCK_WIDTH: 100,
            BLOCK_HEIGHT: 20,
            POWER_UP_CHANCE: 0.001,
            POWER_UP_FALL_SPEED: 0.5,
            POWER_UP_WIGGLE_SPEED: 0.05,
            POWER_UP_WIGGLE_AMPLITUDE: 2,
            GRAVITY: 0.5,
            LEVEL_UP_THRESHOLD: 0.8,
            SPEED_INCREASE_FACTOR: 1.15,
            MAX_FALLS: 3,
            FLASH_DURATION: 100,
            FLASH_COUNT: 3,
            BAR_IMAGE_SRC: null,
            POWER_UP_IMAGE_SRC: null
        };

        const gameContainer = document.getElementById('gameContainer');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const tryAgainButton = document.getElementById('tryAgainButton');

        let WIDTH = 400;
        let HEIGHT = 600;
        let scale;

        function resizeCanvas() {
            const containerWidth = gameContainer.clientWidth;
            const containerHeight = gameContainer.clientHeight;

            canvas.width = containerWidth;
            canvas.height = containerHeight;

            WIDTH = containerWidth;
            HEIGHT = containerHeight;

            scale = WIDTH / 400; // Base scale on 400px width
        }

        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            initGame();
        });

        let blockWidth = GAME_CONFIG.INITIAL_BLOCK_WIDTH;
        let blockSpeed = GAME_CONFIG.INITIAL_BLOCK_SPEED;
        let direction = 1;
        let score = 0;
        let level = 1;
        let fallCount = 0;

        let x = 0;
        let y = HEIGHT - GAME_CONFIG.BLOCK_HEIGHT * scale;

        let stack = [];
        let gameOver = false;
        let fallingBlock = null;
        let fallingLeftover = null;

        const BREAK_PARTICLES = [];
        const PARTICLE_COUNT = 20;

        let blinkCount = 0;
        const BLINK_DURATION = 100;
        const BLINK_TIMES = 3;

        let powerUps = [];
        const POWER_UP_RADIUS = 5;

        let isPrivileged = false;
        let showLevelUp = false;
        let levelUpTimer = 0;

        const barImage = GAME_CONFIG.BAR_IMAGE_SRC ? new Image() : null;
        const powerUpImage = GAME_CONFIG.POWER_UP_IMAGE_SRC ? new Image() : null;

        if (barImage) barImage.src = GAME_CONFIG.BAR_IMAGE_SRC;
        if (powerUpImage) powerUpImage.src = GAME_CONFIG.POWER_UP_IMAGE_SRC;

        function initGame() {
            blockWidth = GAME_CONFIG.INITIAL_BLOCK_WIDTH * scale;
            blockSpeed = GAME_CONFIG.INITIAL_BLOCK_SPEED * scale;
            score = 0;
            level = 1;
            fallCount = 0;
            stack = [];
            gameOver = false;
            fallingBlock = null;
            fallingLeftover = null;
            BREAK_PARTICLES.length = 0;
            blinkCount = 0;
            powerUps = [];
            isPrivileged = false;
            showLevelUp = false;
            levelUpTimer = 0;
            tryAgainButton.style.display = 'none';
            resetBlockPosition();
        }

        function resetBlockPosition() {
            if (Math.random() < 0.5) {
                x = 0;
                direction = 1;
            } else {
                x = WIDTH - blockWidth;
                direction = -1;
            }
            y = HEIGHT - GAME_CONFIG.BLOCK_HEIGHT * scale - (stack.length * GAME_CONFIG.BLOCK_HEIGHT * scale);
        }

        function drawBlock(x, y, width, color) {
            if (barImage) {
                ctx.drawImage(barImage, x, y, width, GAME_CONFIG.BLOCK_HEIGHT * scale);
            } else {
                ctx.fillStyle = color;
                ctx.fillRect(x, y, width, GAME_CONFIG.BLOCK_HEIGHT * scale);
            }
            if (isPrivileged && !fallingBlock) {
                ctx.strokeStyle = 'gold';
                ctx.lineWidth = 2 * scale;
                ctx.strokeRect(x, y, width, GAME_CONFIG.BLOCK_HEIGHT * scale);
            }
        }

        function drawScore() {
            ctx.fillStyle = 'black';
            ctx.font = `${20 * scale}px Arial`;
            ctx.fillText(`Score: ${score}`, 10 * scale, 30 * scale);
            ctx.fillText(`Level: ${level}`, 10 * scale, 60 * scale);
            ctx.fillText(`Falls: ${fallCount}/${GAME_CONFIG.MAX_FALLS}`, 10 * scale, 90 * scale);
        }

        function moveBlock() {
            x += blockSpeed * direction;
            if (x < 0) {
                x = 0;
                direction = 1;
            } else if (x + blockWidth > WIDTH) {
                x = WIDTH - blockWidth;
                direction = -1;
            }
        }

        function gameLoop(timestamp) {
            if (gameOver) {
                if (blinkCount < BLINK_TIMES * 2) {
                    if (blinkCount % 2 === 0) {
                        ctx.fillStyle = 'white';
                        ctx.fillRect(0, 0, WIDTH, HEIGHT);
                    } else {
                        drawGameState();
                    }
                    blinkCount++;
                    setTimeout(() => requestAnimationFrame(gameLoop), BLINK_DURATION);
                } else {
                    setTimeout(showGameOver, 1000);
                }
                return;
            }
            ctx.fillStyle = 'white';
            ctx.clearRect(0, 0, WIDTH, HEIGHT);

            if (!fallingBlock) {
                moveBlock();
                checkPowerUpCollision();
            }

            updateFallingBlocks();
            updatePowerUps();
            drawGameState();

            if (showLevelUp) {
                drawLevelUp();
                levelUpTimer++;
                if (levelUpTimer > 120) {
                    showLevelUp = false;
                    levelUpTimer = 0;
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function updateFallingBlocks() {
            if (fallingBlock) {
                fallingBlock.vy += GAME_CONFIG.GRAVITY * scale;
                fallingBlock.y += fallingBlock.vy;

                if (fallingBlock.y + GAME_CONFIG.BLOCK_HEIGHT * scale >= HEIGHT || checkCollision(fallingBlock)) {
                    createBreakParticles(fallingBlock);
                    fallCount++;
                    if (fallCount >= GAME_CONFIG.MAX_FALLS) {
                        gameOver = true;
                    } else {
                        flashScreen();
                        resetBlockPosition();
                        fallingBlock = null;
                    }
                }
            }

            if (fallingLeftover) {
                fallingLeftover.vy += GAME_CONFIG.GRAVITY * scale;
                fallingLeftover.y += fallingLeftover.vy;

                if (fallingLeftover.y + GAME_CONFIG.BLOCK_HEIGHT * scale >= HEIGHT || checkCollision(fallingLeftover)) {
                    createBreakParticles(fallingLeftover);
                    fallingLeftover = null;
                }
            }
        }

        function flashScreen() {
            let flashCount = 0;
            const flash = () => {
                ctx.fillStyle = flashCount % 2 === 0 ? 'white' : 'red';
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
                flashCount++;
                if (flashCount < GAME_CONFIG.FLASH_COUNT * 2) {
                    setTimeout(flash, GAME_CONFIG.FLASH_DURATION);
                } else {
                    drawGameState();
                }
            };
            flash();
        }

        function updatePowerUps() {
            if (Math.random() < GAME_CONFIG.POWER_UP_CHANCE) {
                powerUps.push({
                    x: Math.random() * (WIDTH - 2 * POWER_UP_RADIUS * scale) + POWER_UP_RADIUS * scale,
                    y: -POWER_UP_RADIUS * scale,
                    angle: 0
                });
            }

            for (let i = powerUps.length - 1; i >= 0; i--) {
                let powerUp = powerUps[i];
                powerUp.y += GAME_CONFIG.POWER_UP_FALL_SPEED * scale;
                powerUp.angle += GAME_CONFIG.POWER_UP_WIGGLE_SPEED;
                powerUp.x += Math.sin(powerUp.angle) * GAME_CONFIG.POWER_UP_WIGGLE_AMPLITUDE * scale;

                if (powerUp.x < 0) powerUp.x += WIDTH;
                if (powerUp.x > WIDTH) powerUp.x -= WIDTH;

                if (powerUp.y > HEIGHT + POWER_UP_RADIUS * scale) {
                    powerUp.y = -POWER_UP_RADIUS * scale;
                }
            }
        }

        function checkPowerUpCollision() {
            for (let i = powerUps.length - 1; i >= 0; i--) {
                let powerUp = powerUps[i];
                if (powerUp.y + POWER_UP_RADIUS * scale > y &&
                    powerUp.y - POWER_UP_RADIUS * scale < y + GAME_CONFIG.BLOCK_HEIGHT * scale &&
                    powerUp.x + POWER_UP_RADIUS * scale > x &&
                    powerUp.x - POWER_UP_RADIUS * scale < x + blockWidth) {
                    const recoveryPercentage = Math.random() * 0.4 + 0.3;
                    const recoveryAmount = GAME_CONFIG.INITIAL_BLOCK_WIDTH * scale * recoveryPercentage;
                    blockWidth = Math.min(blockWidth + recoveryAmount, GAME_CONFIG.INITIAL_BLOCK_WIDTH * scale);
                    
                    if (x + blockWidth > WIDTH) {
                        x = WIDTH - blockWidth;
                    }
                    
                    isPrivileged = true;
                    powerUps.splice(i, 1);
                    break;
                }
            }
        }

        function drawGameState() {
            stack.forEach(block => drawBlock(block.x, block.y, block.width, 'black'));

            if (fallingBlock) {
                drawBlock(fallingBlock.x, fallingBlock.y, fallingBlock.width, 'red');
            } else if (!gameOver) {
                drawBlock(x, y, blockWidth, 'black');
            }

            if (fallingLeftover) {
                drawBlock(fallingLeftover.x, fallingLeftover.y, fallingLeftover.width, 'black');
            }

            powerUps.forEach(powerUp => {
                if (powerUpImage) {
                    ctx.drawImage(powerUpImage, powerUp.x - POWER_UP_RADIUS * scale, powerUp.y - POWER_UP_RADIUS * scale, POWER_UP_RADIUS * 2 * scale, POWER_UP_RADIUS * 2 * scale);
                } else {
                    ctx.beginPath();
                    ctx.arc(powerUp.x, powerUp.y, POWER_UP_RADIUS * scale, 0, Math.PI * 2);
                    ctx.fillStyle = 'blue';
                    ctx.fill();
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 1 * scale;
                    ctx.stroke();
                }
            });

            updateAndDrawParticles();
            drawScore();
        }

        function checkCollision(block) {
            for (let stackBlock of stack) {
                if (block.y + GAME_CONFIG.BLOCK_HEIGHT * scale > stackBlock.y && 
                    block.y < stackBlock.y + GAME_CONFIG.BLOCK_HEIGHT * scale &&
                    block.x < stackBlock.x + stackBlock.width &&
                    block.x + block.width > stackBlock.x) {
                    return true;
                }
            }
            return false;
        }

        function placeBlock() {
            if (gameOver || fallingBlock) return;

            if (stack.length === 0) {
                stack.push({x, y, width: blockWidth});
            } else {
                const prevBlock = stack[stack.length - 1];
                const overlap = Math.min(x + blockWidth, prevBlock.x + prevBlock.width) - Math.max(x, prevBlock.x);

                if (overlap > 0) {
                    const newWidth = isPrivileged ? blockWidth : overlap;
                    const newX = isPrivileged ? x : Math.max(x, prevBlock.x);
                    stack.push({x: newX, y, width: newWidth});
                    
                    if (!isPrivileged && overlap < blockWidth) {
                        if (x < newX) {
                            fallingLeftover = {x, y, width: newX - x, vy: 0};
                        } else {
                            fallingLeftover = {x: newX + newWidth, y, width: (x + blockWidth) - (newX + newWidth), vy: 0};
                        }
                    }
                    
                    blockWidth = newWidth;
                    score++;

                    if (stack.length * GAME_CONFIG.BLOCK_HEIGHT * scale >= HEIGHT * GAME_CONFIG.LEVEL_UP_THRESHOLD) {
                        levelUp();
                    }
                } else {
                    fallingBlock = {x, y, width: blockWidth, vy: 0};
                    return;
                }
            }

            isPrivileged = false;
            resetBlockPosition();
        }

        function levelUp() {
            level++;
            blockSpeed *= GAME_CONFIG.SPEED_INCREASE_FACTOR;
            showLevelUp = true;
            levelUpTimer = 0;

            stack = [];
            resetBlockPosition();
        }

        function drawLevelUp() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            ctx.fillStyle = 'white';
            ctx.font = `${48 * scale}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText(`Level ${level}!`, WIDTH / 2, HEIGHT / 2);
            ctx.font = `${24 * scale}px Arial`;
            ctx.fillText('Speed increased!', WIDTH / 2, HEIGHT / 2 + 40 * scale);
            ctx.textAlign = 'left';
        }

        function createBreakParticles(block) {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                BREAK_PARTICLES.push({
                    x: block.x + Math.random() * block.width,
                    y: block.y + Math.random() * GAME_CONFIG.BLOCK_HEIGHT * scale,
                    vx: (Math.random() - 0.5) * 5 * scale,
                    vy: (Math.random() - 0.5) * 5 * scale,
                    radius: Math.random() * 3 * scale + 1,
                    color: 'red'
                });
            }
        }

        function updateAndDrawParticles() {
            for (let i = BREAK_PARTICLES.length - 1; i >= 0; i--) {
                let p = BREAK_PARTICLES[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1 * scale;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();

                if (p.y > HEIGHT) {
                    BREAK_PARTICLES.splice(i, 1);
                }
            }
        }

        function showGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            ctx.fillStyle = 'white';
            ctx.font = `${48 * scale}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText('Game Over', WIDTH / 2, HEIGHT / 2);
            ctx.font = `${24 * scale}px Arial`;
            ctx.fillText(`Score: ${score}`, WIDTH / 2, HEIGHT / 2 + 40 * scale);
            ctx.fillText(`Level: ${level}`, WIDTH / 2, HEIGHT / 2 + 70 * scale);
            ctx.textAlign = 'left';
            tryAgainButton.style.display = 'block';
        }

        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                placeBlock();
            }
        });

        canvas.addEventListener('touchstart', (event) => {
            event.preventDefault();
            placeBlock();
        });

        canvas.addEventListener('mousedown', placeBlock);

        tryAgainButton.addEventListener('click', () => {
            initGame();
            requestAnimationFrame(gameLoop);
        });

        initGame();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
