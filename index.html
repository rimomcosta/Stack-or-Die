<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Stacking Game</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f0f0f0;
        font-family: Arial, sans-serif;
      }
      #gameContainer {
        position: relative;
        width: 100%;
        max-width: 400px;
        aspect-ratio: 2 / 3;
        padding-top: 20px;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #tryAgainButton {
        position: absolute;
        left: 50%;
        top: 75%;
        transform: translate(-50%, -50%);
        padding: 10px 20px;
        font-size: 18px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        display: none;
      }
      #tryAgainButton:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <div id="gameContainer">
      <canvas id="gameCanvas"></canvas>
      <button id="tryAgainButton">Try Again</button>
    </div>
    <script src="config.js"></script>
    <script>
      const gameContainer = document.getElementById("gameContainer");
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const tryAgainButton = document.getElementById("tryAgainButton");

      let WIDTH = GAME_CONFIG.INITIAL_WIDTH;
      let HEIGHT = GAME_CONFIG.INITIAL_HEIGHT;
      let scale;

      let startTime;
      let elapsedTime = 0;

      let blockWidth, blockSpeed, direction, score, level, lives;
      let x, y;
      let stack, gameOver, fallingBlock, fallingLeftover;
      let BREAK_PARTICLES = [];
      let blinkCount;
      let powerUps;
      let isPrivileged, showLevelUp, levelUpTimer;
      let gameOverScreenShown = false;
      let isFlashing = false;
      let flashTimer = 0;

      let placeTimeLimit;
      let placeTimeRemaining;

      const barImage = GAME_CONFIG.BAR_IMAGE_SRC ? new Image() : null;
      const powerUpImage = GAME_CONFIG.POWER_UP_IMAGE_SRC ? new Image() : null;

      if (barImage) barImage.src = GAME_CONFIG.BAR_IMAGE_SRC;
      if (powerUpImage) powerUpImage.src = GAME_CONFIG.POWER_UP_IMAGE_SRC;

      // Audio objects
      const AUDIO = {};

      function resizeCanvas() {
        const containerWidth = gameContainer.clientWidth;
        const containerHeight = gameContainer.clientHeight;

        canvas.width = containerWidth;
        canvas.height = containerHeight;

        WIDTH = containerWidth;
        HEIGHT = containerHeight;

        scale = WIDTH / GAME_CONFIG.INITIAL_WIDTH;
      }

      function initAudio() {
        Object.keys(GAME_CONFIG.AUDIO).forEach((key) => {
          if (GAME_CONFIG.AUDIO[key]) {
            AUDIO[key] = new Audio(GAME_CONFIG.AUDIO[key]);
            if (key === "BACKGROUND_MUSIC") {
              AUDIO[key].loop = true;
            }
          }
        });
      }

      function playSound(sound) {
        if (AUDIO[sound]) {
          AUDIO[sound].currentTime = 0;
          AUDIO[sound]
            .play()
            .catch((e) => console.warn(`Failed to play ${sound} sound`, e));
        } else {
          // Default beep sound
          const context = new (window.AudioContext ||
            window.webkitAudioContext)();
          const oscillator = context.createOscillator();
          oscillator.type = "sine";

          switch (sound) {
            case "BLOCK_PLACE":
              oscillator.frequency.setValueAtTime(440, context.currentTime); // A4
              break;
            case "BLOCK_FALL":
              oscillator.frequency.setValueAtTime(220, context.currentTime); // A3
              break;
            case "POWER_UP_COLLECT":
              oscillator.frequency.setValueAtTime(880, context.currentTime); // A5
              break;
            case "EXTRA_LIFE_COLLECT":
              oscillator.frequency.setValueAtTime(1760, context.currentTime); // A6
              break;
            case "LEVEL_UP":
              oscillator.frequency.setValueAtTime(1046.5, context.currentTime); // C6
              break;
            case "GAME_OVER":
              oscillator.frequency.setValueAtTime(110, context.currentTime); // A2
              break;
            case "BLOCK_BREAK":
              oscillator.frequency.setValueAtTime(660, context.currentTime); // E5
              break;
            case "BLOCK_SLICE":
              oscillator.frequency.setValueAtTime(550, context.currentTime); // C#5
              break;
            default:
              oscillator.frequency.setValueAtTime(440, context.currentTime); // A4
          }

          oscillator.connect(context.destination);
          oscillator.start();
          oscillator.stop(context.currentTime + 0.1);
        }
      }

      function initGame() {
        blockWidth = GAME_CONFIG.INITIAL_BLOCK_WIDTH * scale;
        blockSpeed = GAME_CONFIG.INITIAL_BLOCK_SPEED * scale;
        score = 0;
        level = 1;
        lives = GAME_CONFIG.MAX_LIVES;
        stack = [];
        gameOver = false;
        gameOverScreenShown = false;
        fallingBlock = null;
        fallingLeftover = null;
        BREAK_PARTICLES = [];
        blinkCount = 0;
        powerUps = [];
        isPrivileged = false;
        showLevelUp = false;
        levelUpTimer = 0;
        tryAgainButton.style.display = "none";
        startTime = Date.now();
        resetBlockPosition();
        resetPlaceTimeLimit();

        if (AUDIO.BACKGROUND_MUSIC) {
          AUDIO.BACKGROUND_MUSIC.currentTime = 0;
          AUDIO.BACKGROUND_MUSIC.play().catch((e) =>
            console.warn("Failed to play background music", e)
          );
        }
      }

      function resetPlaceTimeLimit() {
        placeTimeLimit =
          Math.random() *
            (GAME_CONFIG.MAX_PLACE_TIME - GAME_CONFIG.MIN_PLACE_TIME) +
          GAME_CONFIG.MIN_PLACE_TIME;
        placeTimeRemaining = placeTimeLimit;
      }

      function resetBlockPosition() {
        if (Math.random() < 0.5) {
          x = 0;
          direction = 1;
        } else {
          x = WIDTH - blockWidth;
          direction = -1;
        }
        y =
          HEIGHT -
          GAME_CONFIG.BLOCK_HEIGHT * scale -
          stack.length * GAME_CONFIG.BLOCK_HEIGHT * scale;
      }

      function drawBlock(x, y, width, color) {
        if (barImage) {
          ctx.drawImage(
            barImage,
            x,
            y,
            width,
            GAME_CONFIG.BLOCK_HEIGHT * scale
          );
        } else {
          ctx.fillStyle = color;
          ctx.fillRect(x, y, width, GAME_CONFIG.BLOCK_HEIGHT * scale);
        }
        if (isPrivileged && !fallingBlock) {
          ctx.strokeStyle = "gold";
          ctx.lineWidth = 2 * scale;
          ctx.strokeRect(x, y, width, GAME_CONFIG.BLOCK_HEIGHT * scale);
        }
      }

      function drawScore() {
        ctx.fillStyle = GAME_CONFIG.TEXT_COLOR;
        ctx.font = `${20 * scale}px ${GAME_CONFIG.FONT_FAMILY}`;
        ctx.fillText(`Score: ${score}`, 10 * scale, 50 * scale); // Adjusted y position
        ctx.fillText(`Level: ${level}`, 10 * scale, 80 * scale); // Adjusted y position
        ctx.fillText(
          `Lives: ${lives}/${GAME_CONFIG.MAX_LIVES}`,
          10 * scale,
          110 * scale
        ); // Adjusted y position
        drawTimer();
      }

      function drawTimer() {
        ctx.fillStyle = GAME_CONFIG.TEXT_COLOR;
        ctx.font = `${20 * scale}px ${GAME_CONFIG.FONT_FAMILY}`;
        ctx.fillText(
          `Time: ${formatTime(elapsedTime)}`,
          WIDTH - 100 * scale,
          50 * scale
        ); // Adjusted y position
      }

      function formatTime(ms) {
        let seconds = Math.floor(ms / 1000);
        let minutes = Math.floor(seconds / 60);
        seconds = seconds % 60;
        return `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
      }

      function moveBlock() {
        x += blockSpeed * direction;
        if (x < 0) {
          x = 0;
          direction = 1;
          playSound("EDGE_LEFT");
        } else if (x + blockWidth > WIDTH) {
          x = WIDTH - blockWidth;
          direction = -1;
          playSound("EDGE_RIGHT");
        }
      }

      function gameLoop() {
        if (gameOver) {
          showGameOver();
          return;
        }

        elapsedTime = Date.now() - startTime;

        ctx.fillStyle = GAME_CONFIG.BACKGROUND_COLOR;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        if (!fallingBlock) {
          moveBlock();
          checkPowerUpCollision();

          // Update remaining time
          placeTimeRemaining -= 1 / 60; // Assuming 60 FPS
          if (placeTimeRemaining <= 0) {
            placeBlock(); // Automatically place the block when time runs out
            resetPlaceTimeLimit();
          }
        }

        updateFallingBlocks();
        updatePowerUps();
        drawGameState();

        if (isFlashing) {
          flashTimer++;
          if (flashTimer <= GAME_CONFIG.FLASH_COUNT * 2) {
            if (flashTimer % 2 === 1) {
              ctx.fillStyle = GAME_CONFIG.FLASH_COLOR;
              ctx.fillRect(0, 0, WIDTH, HEIGHT);
            }
          } else {
            isFlashing = false;
            flashTimer = 0;
          }
        }

        if (showLevelUp) {
          drawLevelUp();
          levelUpTimer++;
          if (levelUpTimer > GAME_CONFIG.LEVEL_UP_DISPLAY_DURATION) {
            showLevelUp = false;
            levelUpTimer = 0;
          }
        }
        drawTimerBar();
        requestAnimationFrame(gameLoop);
      }

      function drawTimerBar() {
        const barWidth = WIDTH - 20 * scale;
        const barHeight = 10 * scale;
        const barX = 10 * scale;
        const barY = 20 * scale; // Adjusted y position

        // Draw background
        ctx.fillStyle = "lightgray";
        ctx.fillRect(barX, barY, barWidth, barHeight);

        // Draw remaining time
        const remainingWidth = (placeTimeRemaining / placeTimeLimit) * barWidth;
        ctx.fillStyle = "green";
        ctx.fillRect(barX, barY, remainingWidth, barHeight);

        // Draw border
        ctx.strokeStyle = "black";
        ctx.lineWidth = 2 * scale;
        ctx.strokeRect(barX, barY, barWidth, barHeight);
      }

      function updateFallingBlocks() {
        if (fallingBlock) {
          fallingBlock.vy += GAME_CONFIG.GRAVITY * scale;
          fallingBlock.y += fallingBlock.vy;

          if (
            fallingBlock.y + GAME_CONFIG.BLOCK_HEIGHT * scale >= HEIGHT ||
            checkCollision(fallingBlock)
          ) {
            fallingBlock.y = Math.min(
              fallingBlock.y,
              HEIGHT - GAME_CONFIG.BLOCK_HEIGHT * scale
            );
            loseLife();
          }
        }

        if (fallingLeftover) {
          fallingLeftover.vy += GAME_CONFIG.GRAVITY * scale;
          fallingLeftover.y += fallingLeftover.vy;

          if (
            fallingLeftover.y + GAME_CONFIG.BLOCK_HEIGHT * scale >= HEIGHT ||
            checkCollision(fallingLeftover)
          ) {
            fallingLeftover.y = Math.min(
              fallingLeftover.y,
              HEIGHT - GAME_CONFIG.BLOCK_HEIGHT * scale
            );
            createBreakParticles(fallingLeftover);
            fallingLeftover = null;
          }
        }
      }

      function loseLife() {
        lives--;
        createBreakParticles(fallingBlock);
        playSound("BLOCK_FALL");
        isFlashing = true;
        flashTimer = 0;

        if (lives <= 0) {
          gameOver = true;
          showGameOver();
        } else {
          fallingBlock = null;
          resetBlockPosition();
        }
      }

      function updatePowerUps() {
        if (Math.random() < GAME_CONFIG.POWER_UP_CHANCE) {
          powerUps.push({
            x:
              Math.random() *
                (WIDTH - 2 * GAME_CONFIG.POWER_UP_RADIUS * scale) +
              GAME_CONFIG.POWER_UP_RADIUS * scale,
            y: -GAME_CONFIG.POWER_UP_RADIUS * scale,
            angle: 0,
            type:
              Math.random() < GAME_CONFIG.EXTRA_LIFE_CHANCE
                ? "extraLife"
                : "normal",
          });
        }

        for (let i = powerUps.length - 1; i >= 0; i--) {
          let powerUp = powerUps[i];
          powerUp.y += GAME_CONFIG.POWER_UP_FALL_SPEED * scale;
          powerUp.angle += GAME_CONFIG.POWER_UP_WIGGLE_SPEED;
          powerUp.x +=
            Math.sin(powerUp.angle) *
            GAME_CONFIG.POWER_UP_WIGGLE_AMPLITUDE *
            scale;

          if (powerUp.x < 0) powerUp.x += WIDTH;
          if (powerUp.x > WIDTH) powerUp.x -= WIDTH;

          if (powerUp.y > HEIGHT + GAME_CONFIG.POWER_UP_RADIUS * scale) {
            powerUps.splice(i, 1);
          }
        }
      }

      function checkPowerUpCollision() {
        for (let i = powerUps.length - 1; i >= 0; i--) {
          let powerUp = powerUps[i];
          if (
            powerUp.y + GAME_CONFIG.POWER_UP_RADIUS * scale > y &&
            powerUp.y - GAME_CONFIG.POWER_UP_RADIUS * scale <
              y + GAME_CONFIG.BLOCK_HEIGHT * scale &&
            powerUp.x + GAME_CONFIG.POWER_UP_RADIUS * scale > x &&
            powerUp.x - GAME_CONFIG.POWER_UP_RADIUS * scale < x + blockWidth
          ) {
            if (powerUp.type === "extraLife") {
              lives = Math.min(lives + 1, GAME_CONFIG.MAX_LIVES);
              playSound("EXTRA_LIFE_COLLECT");
            } else {
              const recoveryPercentage = Math.random() * 0.4 + 0.3;
              const recoveryAmount =
                GAME_CONFIG.INITIAL_BLOCK_WIDTH * scale * recoveryPercentage;
              blockWidth = Math.min(
                blockWidth + recoveryAmount,
                GAME_CONFIG.INITIAL_BLOCK_WIDTH * scale
              );

              if (x + blockWidth > WIDTH) {
                x = WIDTH - blockWidth;
              }

              playSound("POWER_UP_COLLECT");
              isPrivileged = true;
            }

            powerUps.splice(i, 1);
            break;
          }
        }
      }

      function drawGameState() {
        stack.forEach((block) =>
          drawBlock(block.x, block.y, block.width, GAME_CONFIG.BLOCK_COLOR)
        );

        if (fallingBlock) {
          drawBlock(
            fallingBlock.x,
            fallingBlock.y,
            fallingBlock.width,
            GAME_CONFIG.FALLING_BLOCK_COLOR
          );
        } else if (!gameOver) {
          drawBlock(x, y, blockWidth, GAME_CONFIG.BLOCK_COLOR);
        }

        if (fallingLeftover) {
          drawBlock(
            fallingLeftover.x,
            fallingLeftover.y,
            fallingLeftover.width,
            GAME_CONFIG.BLOCK_COLOR
          );
        }

        powerUps.forEach((powerUp) => {
          if (powerUpImage) {
            ctx.drawImage(
              powerUpImage,
              powerUp.x - GAME_CONFIG.POWER_UP_RADIUS * scale,
              powerUp.y - GAME_CONFIG.POWER_UP_RADIUS * scale,
              GAME_CONFIG.POWER_UP_RADIUS * 2 * scale,
              GAME_CONFIG.POWER_UP_RADIUS * 2 * scale
            );
          } else {
            ctx.beginPath();
            ctx.arc(
              powerUp.x,
              powerUp.y,
              GAME_CONFIG.POWER_UP_RADIUS * scale,
              0,
              Math.PI * 2
            );
            ctx.fillStyle =
              powerUp.type === "extraLife"
                ? GAME_CONFIG.EXTRA_LIFE_COLOR
                : GAME_CONFIG.POWER_UP_COLOR;
            ctx.fill();
            ctx.strokeStyle = GAME_CONFIG.POWER_UP_STROKE_COLOR;
            ctx.lineWidth = 1 * scale;
            ctx.stroke();
          }
        });

        updateAndDrawParticles();
        drawScore();
      }

      function checkCollision(block) {
        for (let stackBlock of stack) {
          if (
            block.y + GAME_CONFIG.BLOCK_HEIGHT * scale > stackBlock.y &&
            block.y < stackBlock.y + GAME_CONFIG.BLOCK_HEIGHT * scale &&
            block.x < stackBlock.x + stackBlock.width &&
            block.x + block.width > stackBlock.x
          ) {
            return true;
          }
        }
        return false;
      }

      function placeBlock() {
        if (gameOver || fallingBlock) return;

        if (stack.length === 0) {
          stack.push({ x, y, width: blockWidth });
          playSound("BLOCK_PLACE");
        } else {
          const prevBlock = stack[stack.length - 1];
          let overlap =
            Math.min(x + blockWidth, prevBlock.x + prevBlock.width) -
            Math.max(x, prevBlock.x);

          // Implement snapping
          const snapThreshold = GAME_CONFIG.SNAP_THRESHOLD * scale;
          if (Math.abs(x - prevBlock.x) <= snapThreshold) {
            x = prevBlock.x;
            overlap = blockWidth;
          } else if (
            Math.abs(x + blockWidth - (prevBlock.x + prevBlock.width)) <=
            snapThreshold
          ) {
            x = prevBlock.x + prevBlock.width - blockWidth;
            overlap = blockWidth;
          }

          if (overlap >= 1) {
            const newWidth = isPrivileged ? blockWidth : overlap;
            const newX = isPrivileged ? x : Math.max(x, prevBlock.x);
            stack.push({ x: newX, y, width: newWidth });

            if (!isPrivileged && overlap < blockWidth) {
              if (x < newX) {
                fallingLeftover = { x, y, width: newX - x, vy: 0 };
              } else {
                fallingLeftover = {
                  x: newX + newWidth,
                  y,
                  width: x + blockWidth - (newX + newWidth),
                  vy: 0,
                };
              }
              playSound("BLOCK_SLICE");
            } else {
              playSound("BLOCK_PLACE");
            }

            blockWidth = newWidth;
            score++;

            if (
              stack.length * GAME_CONFIG.BLOCK_HEIGHT * scale >=
              HEIGHT * GAME_CONFIG.LEVEL_UP_THRESHOLD
            ) {
              levelUp();
            }
          } else {
            fallingBlock = { x, y, width: blockWidth, vy: 0 };
            playSound("BLOCK_SLICE");
            return;
          }
        }

        isPrivileged = false;
        resetBlockPosition();
        resetPlaceTimeLimit();
      }

      function levelUp() {
        level++;
        blockSpeed *= GAME_CONFIG.SPEED_INCREASE_FACTOR;
        showLevelUp = true;
        levelUpTimer = 0;

        playSound("LEVEL_UP");

        stack = [];
        resetBlockPosition();
        // Decrease time limit
        GAME_CONFIG.MIN_PLACE_TIME *= GAME_CONFIG.PLACE_TIME_DECREASE_FACTOR;
        GAME_CONFIG.MAX_PLACE_TIME *= GAME_CONFIG.PLACE_TIME_DECREASE_FACTOR;

        resetPlaceTimeLimit();
      }

      function drawLevelUp() {
        ctx.fillStyle = GAME_CONFIG.GAME_OVER_OVERLAY_COLOR;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = GAME_CONFIG.GAME_OVER_TEXT_COLOR;
        ctx.font = `${48 * scale}px ${GAME_CONFIG.FONT_FAMILY}`;
        ctx.textAlign = "center";
        ctx.fillText(`Level ${level}!`, WIDTH / 2, HEIGHT / 2 - 40 * scale);
        ctx.font = `${24 * scale}px ${GAME_CONFIG.FONT_FAMILY}`;
        ctx.fillText("Speed increased!", WIDTH / 2, HEIGHT / 2);
        ctx.textAlign = "left";
      }

      function createBreakParticles(block) {
        playSound("BLOCK_BREAK");
        for (let i = 0; i < GAME_CONFIG.PARTICLE_COUNT; i++) {
          BREAK_PARTICLES.push({
            x: block.x + Math.random() * block.width,
            y: block.y + Math.random() * GAME_CONFIG.BLOCK_HEIGHT * scale,
            vx: (Math.random() - 0.5) * 5 * scale,
            vy: (Math.random() - 0.5) * 5 * scale,
            radius: Math.random() * 3 * scale + 1,
            color: GAME_CONFIG.BLOCK_COLOR,
          });
        }
      }

      function updateAndDrawParticles() {
        for (let i = BREAK_PARTICLES.length - 1; i >= 0; i--) {
          let p = BREAK_PARTICLES[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += GAME_CONFIG.GRAVITY * scale * 0.2;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();

          if (p.y > HEIGHT) {
            BREAK_PARTICLES.splice(i, 1);
          }
        }
      }

      function showGameOver() {
        if (gameOverScreenShown) return;
        gameOverScreenShown = true;

        // Ensure flashing stops
        isFlashing = false;
        flashTimer = 0;

        ctx.fillStyle = GAME_CONFIG.GAME_OVER_OVERLAY_COLOR;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = GAME_CONFIG.GAME_OVER_TEXT_COLOR;
        ctx.font = `${48 * scale}px ${GAME_CONFIG.FONT_FAMILY}`;
        ctx.textAlign = "center";
        ctx.fillText("Game Over", WIDTH / 2, HEIGHT / 2 - 60 * scale);
        ctx.font = `${24 * scale}px ${GAME_CONFIG.FONT_FAMILY}`;
        ctx.fillText(`Score: ${score}`, WIDTH / 2, HEIGHT / 2 - 20 * scale);
        ctx.fillText(`Level: ${level}`, WIDTH / 2, HEIGHT / 2 + 10 * scale);
        ctx.fillText(
          `Time: ${formatTime(elapsedTime)}`,
          WIDTH / 2,
          HEIGHT / 2 + 40 * scale
        );
        ctx.textAlign = "left";
        tryAgainButton.style.display = "block";

        playSound("GAME_OVER");
        if (AUDIO.BACKGROUND_MUSIC) {
          AUDIO.BACKGROUND_MUSIC.pause();
        }
      }

      function handleTryAgain() {
        initGame();
        gameLoop();
      }

      document.addEventListener("keydown", (event) => {
        if (event.code === "Space") {
          if (gameOver && gameOverScreenShown) {
            handleTryAgain();
          } else if (!gameOver) {
            placeBlock();
          }
        }
      });

      canvas.addEventListener("touchstart", (event) => {
        event.preventDefault();
        if (gameOver && gameOverScreenShown) {
          handleTryAgain();
        } else if (!gameOver) {
          placeBlock();
        }
      });

      canvas.addEventListener("mousedown", (event) => {
        if (gameOver && gameOverScreenShown) {
          handleTryAgain();
        } else if (!gameOver) {
          placeBlock();
        }
      });

      tryAgainButton.addEventListener("click", handleTryAgain);

      resizeCanvas();
      window.addEventListener("resize", () => {
        resizeCanvas();
        if (!gameOver) {
          initGame();
        }
      });

      initAudio();
      initGame();
      gameLoop();
    </script>
  </body>
</html>
